# Self-hosted TraceCDS: web app + open-source LLM (Ollama) + automatic HTTPS (Caddy).
# All components are open source: Gradio (Apache-2.0), Ollama (MIT), SearXNG (AGPL-3.0),
# Caddy (Apache-2.0), default model BioMistral-7B-DARE (Apache-2.0).
services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama:/root/.ollama
    # Not published to the internet; only the app can reach it.

  model-pull:
    image: ollama/ollama:latest
    depends_on: [ollama]
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: ["/bin/sh", "-c", "sleep 5 && ollama pull ${TRACECDS_MODEL:-hf.co/mradermacher/BioMistral-Instructv0.2-7B-DARE-GGUF:Q4_K_M}"]
    restart: "no"

  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET}
      - SEARXNG_BASE_URL=http://searxng:8080/
    volumes:
      - ./deploy/searxng:/etc/searxng
    # Not published to the internet; only the app can reach it.

  app:
    build: .
    restart: unless-stopped
    depends_on: [ollama, searxng]
    environment:
      - SEARXNG_URL=http://searxng:8080
      - TRACECDS_LLM_URL=http://ollama:11434/v1
      - TRACECDS_MODEL=${TRACECDS_MODEL:-hf.co/mradermacher/BioMistral-Instructv0.2-7B-DARE-GGUF:Q4_K_M}
      - TRACECDS_HOME_URL=${TRACECDS_HOME_URL:-https://tracecds.com}
      - OPENFDA_API_KEY=${OPENFDA_API_KEY:-}
    volumes:
      - data:/data

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN}
      - CHAT_DOMAIN=${CHAT_DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  ollama:
  data:
  caddy_data:
  caddy_config:
